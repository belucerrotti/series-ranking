<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ranking Smiling Friends</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="app">

<h1>Ranking Smiling Friends</h1>

<div class="filter">
  <label>Temporadas:</label>
  <select id="seasonFilter">
    <option value="all">Todas</option>
    <option value="1">Temporada 1</option>
    <option value="2">Temporada 2</option>
    <option value="3">Temporada 3</option>
  </select>
</div>

<div><div id="progress"></div></div>

<!-- =============================
     ÁREA DE COMPARACIÓN
============================== -->
<div class="compare-area" id="compareArea">
  <h2>Elegí tu favorito</h2>

  <div class="cards-container">
    <div class="card" id="leftCard">
      <img id="leftImg">
      <div class="card-body">
        <h3 id="leftTitle"></h3>
        <div class="meta" id="leftMeta"></div>
      </div>
    </div>

    <div class="vs">VS</div>

    <div class="card" id="rightCard">
      <img id="rightImg">
      <div class="card-body">
        <h3 id="rightTitle"></h3>
        <div class="meta" id="rightMeta"></div>
      </div>
    </div>
  </div>

  <button class="undo-btn" id="undoBtn">Deshacer</button>
</div>

<!-- =============================
     RANKING FINAL
============================== -->
<div class="final-ranking" id="finalRanking">
  <h1>🏆 Ranking Final</h1>

  <ul class="ranking-list" id="rankingList"></ul>

  <div class="final-controls">
    <button class="final-btn" id="retryBtn">Volver a hacerlo</button>
    <button class="undo-btn" id="undoFinal">Deshacer última elección</button>
  </div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
